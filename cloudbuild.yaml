steps:
  - id: InstallCodeMender
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    script: |
      #!/usr/bin/env bash
      set -euo pipefail
      curl -fsSL -o /tmp/cm.zip "$_CM_DOWNLOAD_URL"
      
      # Symlink the bundled python so 'python3' works natively
      ln -s /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3 /usr/local/bin/python3

      python3 -m zipfile -e /tmp/cm.zip /workspace/.codemender-cli
      
      chmod +x /workspace/.codemender-cli/cm


  - id: 'CodeMenderScan'
    name: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:slim'
    waitFor: ['InstallCodeMender']
    script: |
      #!/usr/bin/env bash
      set -uo pipefail
      export PATH="/workspace/.codemender-cli:$PATH"
      export GOOGLE_CLOUD_PROJECT="$PROJECT_ID"

      cm init || exit 1
      status=0

      echo "Starting CodeMender scan on source directory..."
      # If _BASE_BRANCH is set (e.g. in PR triggers), run diff scan; otherwise full repo scan
      if [ -n "${_BASE_BRANCH:-}" ]; then
        echo "=== Diff scan ==="
        cm find . \
          --diff="origin/${_BASE_BRANCH}" \
          --diff-workers=16 \
          --fail-on="${_CODEMENDER_FAIL_ON}" \
          --format=sarif \
          --output=codemender.sarif \
          --sandbox=false \
          --yes \
          --bypass-warning || status=$?
      else
        echo "=== Running full repo scan ==="
        cm find . \
          --fail-on="${_CODEMENDER_FAIL_ON}" \
          --format=sarif \
          --output=codemender.sarif \
          --sandbox=false \
          --yes \
          --bypass-warning || status=$?
      fi

      if [ -f codemender.sarif ]; then
        echo "=== CodeMender Findings Summary ==="
        cm report --status=OPEN --format=table

        # Upload report to GCS if a bucket is configured
        if [ -n "${_REPORT_BUCKET:-}" ]; then
          gcloud storage cp codemender.sarif "gs://${_REPORT_BUCKET}/codemender/${BUILD_ID}.sarif" || true
        fi
      fi

      exit "$status"

  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args: [
      'build',
      '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}',
      '.'
    ]

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    waitFor: ['Build']
    args: [
      'push',
      '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}'
    ]

  # 3. Scan for Vulnerabilities in the image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: VulnerabilityScan
    waitFor: ['Push']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        image='${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}'
        echo "Scanning image: $image"
        
        # Start the scan and capture the SCAN id
        # We use --remote because the image has already been pushed to Artifact Registry
        scan_name=$(gcloud artifacts docker images scan "$image" \
          --format='value(response.scan)' \
          --remote)
        
        echo "Scan completed. Scan ID: $scan_name"
        echo "Checking for findings matching threshold: $_SEVERITY_THRESHOLD"
        
        # Check for vulnerabilities matching the threshold regex (e.g. CRITICAL|HIGH)
        vulnerabilities=$(gcloud artifacts docker images list-vulnerabilities "$scan_name" \
          --format='value(vulnerability.effectiveSeverity)' | grep -E "$_SEVERITY_THRESHOLD" | wc -l || true)
        
        if [ "$vulnerabilities" -gt 0 ]; then
          echo "WARNING: Found $vulnerabilities findings matching '$_SEVERITY_THRESHOLD'."
          echo "Listing findings:"
          # List all and use grep to show only matching severities to avoid --filter issues
          gcloud artifacts docker images list-vulnerabilities "$scan_name" \
            --format='table(vulnerability.effectiveSeverity, vulnerability.shortDescription)' | grep -E "Severity|$_SEVERITY_THRESHOLD"
          
          # Optionally exit and block build
          # exit 1

        else
          echo "SUCCESS: No findings matching '$_SEVERITY_THRESHOLD' found. Proceeding."
        fi

        echo ">>> Scan Completed. Continuing build."

  # 4. Create a Release in Cloud Deploy (Hands off to CD)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy
    waitFor: ['VulnerabilityScan']
    entrypoint: gcloud
    args:
      - 'deploy'
      - 'releases'
      - 'create'
      - 'release-$SHORT_SHA'
      - '--delivery-pipeline=mcp-on-cloudrun-pipeline'
      - '--region=${_REGION}'
      - '--images=mcp-on-cloudrun=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}'
  
  
  # Deploy container image to Cloud Run
  #- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  #  entrypoint: gcloud
  #  args:
  #    - 'run'
  #    - 'deploy'
  #    - '${_SERVICE_NAME}'
  #    - '--image'
  #    - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}'
  #    - '--region'
  #    - '${_REGION}'
  #    - '--platform'
  #    - 'managed'
  #    - '--allow-unauthenticated'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}'

substitutions:
  _REGION: us-central1
  _REPOSITORY: gmao-repo
  _IMAGE_NAME: mcp-on-cloudrun
  _SERVICE_NAME: mcp-on-cloudrun
  _SEVERITY_THRESHOLD: 'CRITICAL|HIGH'  # For Artifact Registry Image scanning
  _CODEMENDER_FAIL_ON: 'CRITICAL' #'CRITICAL,HIGH'  # For CodeMender scanning
  _BASE_BRANCH: ''       # Set to 'main' for PR diff scans
  _CM_DOWNLOAD_URL: https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media
  _REPORT_BUCKET: 'gmao-test-bucket'  # Optional: a bucket to save the SARIF report in.

options:
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
